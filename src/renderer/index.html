<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src * data: file:;">
  <title>MarkdownPad</title>
  <link rel="stylesheet" href="../../node_modules/github-markdown-css/github-markdown.css">
  <link rel="stylesheet" href="../../node_modules/highlight.js/styles/github.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="../../node_modules/highlight.js/styles/github-dark.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="toolbar">
    <button data-action="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button data-action="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button data-action="strike" title="Strikethrough"><s>S</s></button>
    <span class="sep"></span>
    <button data-action="h1" title="Heading 1 (Ctrl+1)">H1</button>
    <button data-action="h2" title="Heading 2 (Ctrl+2)">H2</button>
    <button data-action="h3" title="Heading 3 (Ctrl+3)">H3</button>
    <span class="sep"></span>
    <button data-action="link" title="Link (Ctrl+K)">🔗</button>
    <button data-action="image" title="Image">🖼</button>
    <button data-action="code" title="Inline code">&lt;/&gt;</button>
    <button data-action="codeblock" title="Code block">{ }</button>
    <span class="sep"></span>
    <button data-action="quote" title="Blockquote">❝</button>
    <button data-action="ul" title="Bullet list">•≡</button>
    <button data-action="ol" title="Numbered list">1≡</button>
    <button data-action="task" title="Task list">☑</button>
    <button data-action="table" title="Table">⊞</button>
    <button data-action="hr" title="Horizontal rule">—</button>
  </div>

  <div id="main">
    <textarea id="editor" spellcheck="true" placeholder="Start typing Markdown here…"></textarea>
    <div id="divider" title="Drag to resize"></div>
    <div id="preview-wrap">
      <div id="preview" class="markdown-body"></div>
    </div>
  </div>

  <div id="statusbar">
    <span id="save-status">Ready</span>
    <span id="file-path" title=""></span>
    <span class="spacer"></span>
    <span id="cursor-pos">Ln 1, Col 1</span>
    <span id="counts">0 words · 0 characters</span>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
